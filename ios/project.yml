name: SLTWordCards

options:
  bundleIdPrefix: com.applebytechnical
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3PJCNVU63X

targets:
  SLTWordCards:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SLTWordCards
      # Content lives at the repo root so the web app and the iOS app share one
      # source of truth. These are the offline baseline; newer copies are pulled
      # from GitHub at runtime into Application Support.
      - path: ../cards.csv
        buildPhase: resources
      - path: ../images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applebytechnical.SLTWordCards
        PRODUCT_NAME: SLT Cards
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: SLTWordCards.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # One app across iPhone, iPad and Mac. The bundle id is deliberately not
        # derived per-platform so all three share the same iCloud container.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: SLTWordCards/Info.plist
      properties:
        CFBundleDisplayName: SLT Cards
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Shared decks: a .sltdeck file opens straight into the app. In-place
        # access is declared because the pack is read from the original file
        # (security scoped) and copied into a deck; macOS requires YES.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: SLT Card Deck
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.applebytechnical.sltwordcards.deck
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.applebytechnical.sltwordcards.deck
            UTTypeDescription: SLT Card Deck
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - sltdeck
              public.mime-type:
                - application/x-slt-deck+json
        # Lets a deck link from the web app hand off to the installed app.
        CFBundleURLTypes:
          - CFBundleURLName: com.applebytechnical.sltwordcards.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - sltcards
