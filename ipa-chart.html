<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA Chart | SLT Word Cards</title>
    <meta name="description" content="International Phonetic Alphabet (IPA) chart of consonants and vowels laid out in the standard arrangement. Click any symbol to copy it to your clipboard.">
    <link rel="canonical" href="https://speakeasy-slt.uk/ipa-chart.html">

    <!-- Favicon -->
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="styles.css">
    <style>
        /* Widen the container for the wide consonant table */
        .app-container { max-width: 1140px; }

        .chart { display: flex; flex-direction: column; gap: 1.5rem; }
        .chart-section { gap: 1rem; }
        .chart-sub { color: var(--text-secondary); font-size: 0.9rem; margin-top: -0.5rem; }

        .table-scroll { overflow-x: auto; }
        .ipa-table { border-collapse: collapse; width: 100%; }
        .ipa-table th,
        .ipa-table td { border: 1px solid rgba(203, 213, 225, 0.7); text-align: center; padding: 2px; }
        .ipa-table thead th {
            font-size: 0.68rem; font-weight: 600; color: var(--text-secondary);
            padding: 5px 3px; background: rgba(99, 102, 241, 0.06); line-height: 1.15;
        }
        .ipa-table .rowhead {
            font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
            text-align: left; white-space: nowrap; padding: 0 8px; background: rgba(99, 102, 241, 0.06);
        }
        .ipa-table td.shaded {
            background: repeating-linear-gradient(45deg,
                rgba(148, 163, 184, 0.28), rgba(148, 163, 184, 0.28) 4px,
                rgba(148, 163, 184, 0.12) 4px, rgba(148, 163, 184, 0.12) 8px);
        }

        .ipa-chip {
            min-width: 2rem; height: 2rem; padding: 0 0.35rem; margin: 1px;
            border: 1px solid rgba(203, 213, 225, 0.8); border-radius: 6px;
            background: rgba(255, 255, 255, 0.9); font-family: 'Inter', sans-serif;
            font-size: 1.15rem; line-height: 1; color: var(--text-primary);
            cursor: pointer; transition: all 0.12s ease;
        }
        .ipa-chip:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); transform: translateY(-1px); }
        .ipa-chip.copied { background: #22c55e; color: #fff; border-color: #22c55e; }
        /* Underline marks symbols that can be played aloud */
        .ipa-chip.has-audio { text-decoration: underline; text-decoration-color: rgba(99, 102, 241, 0.55); text-decoration-thickness: 2px; text-underline-offset: 2px; }

        .sound-bar { display: flex; justify-content: center; }
        .sound-toggle {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.55rem 1.4rem; border-radius: 9999px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; color: #fff; background: var(--primary-color);
            border: none; transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(99,102,241,0.3);
        }
        .sound-toggle:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(99,102,241,0.35); }
        .sound-toggle.off {
            background: rgba(255,255,255,0.85); color: var(--text-secondary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid rgba(203,213,225,0.9);
        }
        .sound-toggle svg { flex-shrink: 0; }

        .chip-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .chip-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; width: 6rem; text-align: center; }
        .chip-desc { font-size: 0.68rem; color: var(--text-secondary); line-height: 1.2; }

        /* Vowel trapezium — scrollable on mobile, full-size on wide screens */
        .vowel-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
        .vowel-wrap { width: 820px; }
        .vowel-svg { width: 820px; height: auto; font-family: 'Inter', sans-serif; }
        .vowel-svg .v-outline { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
        .vowel-svg .v-line { fill: none; stroke: #94a3b8; stroke-width: 1; }
        .vowel-svg .v-guide { fill: none; stroke: #cbd5e1; stroke-width: 0.8; stroke-dasharray: 5 4; }
        .vowel-svg .v-bullet { fill: #64748b; }
        .vowel-svg .v-label { fill: var(--text-secondary); font-size: 14px; font-weight: 600; }
        /* Chip boxes behind each vowel symbol */
        .vowel-chip { cursor: pointer; }
        .vowel-chip .v-chip-bg {
            fill: rgba(255,255,255,0.92); stroke: rgba(203,213,225,0.9);
            stroke-width: 1; transition: fill 0.12s ease, stroke 0.12s ease;
        }
        .vowel-chip.has-audio .v-chip-bg { stroke: rgba(99,102,241,0.5); stroke-width: 1.5; }
        .vowel-chip:hover .v-chip-bg { fill: var(--primary-color); stroke: var(--primary-color); }
        .vowel-chip:hover .vowel-sym { fill: #fff; }
        .vowel-chip.copied .v-chip-bg { fill: #22c55e; stroke: #22c55e; }
        .vowel-chip.copied .vowel-sym { fill: #fff; }
        .vowel-svg .vowel-sym { fill: var(--text-primary); font-size: 22px; transition: fill 0.12s ease; pointer-events: none; }

        /* ---- Practice / Test feature ---------------------------------------- */
        .practice-controls {
            display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
        }
        .mode-tabs {
            display: flex; background: rgba(99,102,241,0.1);
            border-radius: 9999px; padding: 3px; gap: 2px;
        }
        .mode-tab {
            padding: 0.38rem 1.1rem; border-radius: 9999px; font-size: 0.88rem;
            font-weight: 600; cursor: pointer; border: none;
            background: transparent; color: var(--primary-hover); transition: all 0.15s ease;
        }
        .mode-tab.active { background: var(--primary-color); color: #fff; }
        .new-set-btn {
            padding: 0.38rem 1.1rem; border-radius: 9999px; font-size: 0.88rem; font-weight: 600;
            cursor: pointer; background: transparent;
            border: 1.5px solid rgba(99,102,241,0.3); color: var(--primary-hover);
            transition: all 0.15s ease;
        }
        .new-set-btn:hover { border-color: var(--primary-color); background: rgba(99,102,241,0.07); }
        .practice-progress { margin-left: auto; font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; }

        .test-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem;
        }
        @media (max-width: 640px) { .test-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Card flip */
        .test-card { perspective: 900px; aspect-ratio: 1; }
        .test-card-inner {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.42s ease;
        }
        .test-card.flipped .test-card-inner { transform: rotateY(180deg); }
        .test-card-front, .test-card-back {
            position: absolute; inset: 0; backface-visibility: hidden;
            -webkit-backface-visibility: hidden; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 0.5rem; padding: 0.65rem 0.5rem 0.5rem;
            border: 1.5px solid rgba(203,213,225,0.85);
            background: rgba(255,255,255,0.92); text-align: center;
            user-select: none; overflow: hidden;
        }
        .test-card-back {
            transform: rotateY(180deg);
            background: rgba(99,102,241,0.05);
            border-color: rgba(99,102,241,0.25);
        }
        .card-sym-lg { font-size: clamp(2rem,4vw,3rem); line-height: 1; color: var(--text-primary); }
        .card-sym-sm { font-size: clamp(1.4rem,2.8vw,2rem); line-height: 1; color: var(--primary-color); font-weight: 600; }
        .card-label { font-size: clamp(0.58rem,1vw,0.72rem); color: var(--text-secondary); line-height: 1.3; font-weight: 500; }
        /* Play button — circular, prominent */
        .card-play-btn {
            width: 3rem; height: 3rem; padding: 0; border-radius: 50%; border: none; cursor: pointer;
            background: var(--primary-color); color: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 10px rgba(99,102,241,0.35); transition: all 0.15s ease;
            pointer-events: all; flex-shrink: 0;
        }
        .card-play-btn:hover { transform: scale(1.1); box-shadow: 0 4px 14px rgba(99,102,241,0.45); }
        .card-play-btn:active { transform: scale(0.94); }
        /* Reveal button — subtle pill at bottom of card */
        .card-reveal-btn {
            margin-top: auto; padding: 0.22rem 0.8rem; border-radius: 9999px;
            border: 1.5px solid rgba(99,102,241,0.3); background: transparent;
            color: var(--primary-hover); font-size: 0.65rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s ease; pointer-events: all;
        }
        .card-reveal-btn:hover { background: rgba(99,102,241,0.08); border-color: var(--primary-color); }
        /* Replay button on the back face */
        .card-replay-btn {
            display: inline-flex; align-items: center; gap: 0.25rem;
            padding: 0.22rem 0.7rem; border-radius: 9999px; border: none;
            background: rgba(99,102,241,0.1); color: var(--primary-hover);
            font-size: 0.65rem; font-weight: 600; cursor: pointer;
            transition: background 0.15s; pointer-events: all;
        }
        .card-replay-btn:hover { background: rgba(99,102,241,0.2); }

        .ipa-toast {
            position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(1rem);
            background: rgba(30, 41, 59, 0.95); color: #fff; padding: 0.6rem 1.1rem;
            border-radius: 9999px; font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-md); opacity: 0; transition: all 0.2s ease;
            pointer-events: none; z-index: 100;
        }
        .ipa-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="top-nav">
            <a href="index.html" class="nav-link">Word Cards</a>
            <a href="ipa-chart.html" class="nav-link active">IPA Chart</a>
        </nav>
        <header class="app-header">
            <h1>IPA Chart</h1>
            <p>Consonants and vowels in the standard arrangement. Click a symbol to copy it — <u>underlined</u> symbols also play a sound.</p>
        </header>

        <div class="sound-bar">
            <button type="button" id="soundToggle" class="sound-toggle" aria-pressed="true"></button>
        </div>

        <main id="chart" class="chart"></main>

        <footer style="text-align: center; color: var(--text-secondary); font-size: 0.9rem; padding-top: 1rem;">
            made with love · <a href="index.html" style="color: var(--primary-hover);">Word Cards</a>
            <br>
            <span style="font-size: 0.8rem;">Audio: <a href="https://commons.wikimedia.org/" style="color: var(--primary-hover);">Wikimedia Commons</a> contributors, CC BY-SA 3.0 (<a href="audio/CREDITS.md" style="color: var(--primary-hover);">credits</a>)</span>
        </footer>
    </div>

    <div id="toast" class="ipa-toast" hidden></div>

    <script>
        // ---- Data ------------------------------------------------------------
        const N = null; // shaded (articulation judged impossible)

        const PLACES = ['Bilabial', 'Labiodental', 'Dental', 'Alveolar', 'Postalveolar', 'Retroflex', 'Palatal', 'Velar', 'Uvular', 'Pharyngeal', 'Glottal'];

        // Each manner row: 11 cells. Cell = array of symbols (voiceless, voiced),
        // [] = possible but unattested (blank), N = shaded (impossible).
        const MANNERS = [
            ['Plosive',             [['p', 'b'], [], [], ['t', 'd'], [], ['ʈ', 'ɖ'], ['c', 'ɟ'], ['k', 'ɡ'], ['q', 'ɢ'], N, ['ʔ']]],
            ['Nasal',               [['m'], ['ɱ'], [], ['n'], [], ['ɳ'], ['ɲ'], ['ŋ'], ['ɴ'], N, N]],
            ['Trill',               [['ʙ'], [], [], ['r'], [], N, N, N, ['ʀ'], N, N]],
            ['Tap or Flap',         [N, ['ⱱ'], [], ['ɾ'], [], ['ɽ'], N, N, N, N, N]],
            ['Fricative',           [['ɸ', 'β'], ['f', 'v'], ['θ', 'ð'], ['s', 'z'], ['ʃ', 'ʒ'], ['ʂ', 'ʐ'], ['ç', 'ʝ'], ['x', 'ɣ'], ['χ', 'ʁ'], ['ħ', 'ʕ'], ['h', 'ɦ']]],
            ['Lateral fricative',   [N, N, [], ['ɬ', 'ɮ'], [], [], [], [], N, N, N]],
            ['Approximant',         [[], ['ʋ'], [], ['ɹ'], [], ['ɻ'], ['j'], ['ɰ'], [], [], []]],
            ['Lateral approximant', [N, N, [], ['l'], [], ['ɭ'], ['ʎ'], ['ʟ'], [], N, N]]
        ];

        const CLICKS = [['ʘ', 'Bilabial'], ['ǀ', 'Dental'], ['ǃ', '(Post)alveolar'], ['ǂ', 'Palatoalveolar'], ['ǁ', 'Alveolar lateral']];
        const IMPLOSIVES = [['ɓ', 'Bilabial'], ['ɗ', 'Dental/alveolar'], ['ʄ', 'Palatal'], ['ɠ', 'Velar'], ['ʛ', 'Uvular']];
        const EJECTIVES = [['ʼ', 'Ejective mark'], ['pʼ', 'Bilabial'], ['tʼ', 'Alveolar'], ['kʼ', 'Velar'], ['sʼ', 'Alveolar fricative']];

        const OTHER = [
            ['ʍ', 'Voiceless labial-velar fricative'],
            ['w', 'Voiced labial-velar approximant'],
            ['ɥ', 'Voiced labial-palatal approximant'],
            ['ʜ', 'Voiceless epiglottal fricative'],
            ['ʢ', 'Voiced epiglottal fricative'],
            ['ʡ', 'Epiglottal plosive'],
            ['ɕ', 'Voiceless alveolo-palatal fricative'],
            ['ʑ', 'Voiced alveolo-palatal fricative'],
            ['ɺ', 'Voiced alveolar lateral flap'],
            ['ɧ', 'Simultaneous ʃ and x']
        ];

        // Vowels positioned on the trapezium. row 0..6 (Close..Open),
        // pos = front | nearfront | central | nearback | back.
        // un = unrounded (left of bullet), ro = rounded (right of bullet).
        const VOWELS = [
            { row: 0, pos: 'front',     un: 'i', ro: 'y' },
            { row: 0, pos: 'central',   un: 'ɨ', ro: 'ʉ' },
            { row: 0, pos: 'back',      un: 'ɯ', ro: 'u' },
            { row: 1, pos: 'nearfront', un: 'ɪ', ro: 'ʏ' },
            { row: 1, pos: 'nearback',  un: '',  ro: 'ʊ' },
            { row: 2, pos: 'front',     un: 'e', ro: 'ø' },
            { row: 2, pos: 'central',   un: 'ɘ', ro: 'ɵ' },
            { row: 2, pos: 'back',      un: 'ɤ', ro: 'o' },
            { row: 3, pos: 'central',   un: 'ə', ro: '' },
            { row: 4, pos: 'front',     un: 'ɛ', ro: 'œ' },
            { row: 4, pos: 'central',   un: 'ɜ', ro: 'ɞ' },
            { row: 4, pos: 'back',      un: 'ʌ', ro: 'ɔ' },
            { row: 5, pos: 'front',     un: 'æ', ro: '' },
            { row: 5, pos: 'central',   un: 'ɐ', ro: '' },
            { row: 6, pos: 'front',     un: 'a', ro: 'ɶ' },
            { row: 6, pos: 'back',      un: 'ɑ', ro: 'ɒ' }
        ];

        // Symbol -> audio file slug (audio/<slug>.mp3). Sourced from Wikimedia Commons.
        const AUDIO = {
            // Plosives
            'p': 'p', 'b': 'b', 't': 't', 'd': 'd', 'k': 'k', 'ɡ': 'g',
            'ʈ': 'retroflex_plosive_vl', 'ɖ': 'retroflex_plosive_vd',
            'c': 'palatal_plosive_vl', 'ɟ': 'palatal_plosive_vd',
            'q': 'uvular_plosive_vl', 'ɢ': 'uvular_plosive_vd',
            'ʔ': 'glottal_stop',
            // Nasals
            'm': 'm', 'n': 'n', 'ŋ': 'eng',
            'ɱ': 'labiodental_nasal', 'ɳ': 'retroflex_nasal',
            'ɲ': 'palatal_nasal', 'ɴ': 'uvular_nasal',
            // Trills
            'ʙ': 'bilabial_trill', 'r': 'r', 'ʀ': 'uvular_trill',
            // Taps / Flaps
            'ⱱ': 'labiodental_flap', 'ɾ': 'alveolar_tap', 'ɽ': 'retroflex_flap',
            // Fricatives
            'ɸ': 'bilabial_fric_vl', 'β': 'bilabial_fric_vd',
            'f': 'f', 'v': 'v', 'θ': 'theta', 'ð': 'eth',
            's': 's', 'z': 'z', 'ʃ': 'esh', 'ʒ': 'ezh',
            'ʂ': 'retroflex_fric_vl', 'ʐ': 'retroflex_fric_vd',
            'ç': 'palatal_fric_vl', 'ʝ': 'palatal_fric_vd',
            'x': 'velar_fric_vl', 'ɣ': 'velar_fric_vd',
            'χ': 'uvular_fric_vl', 'ʁ': 'uvular_fric_vd',
            'ħ': 'pharyngeal_fric_vl', 'ʕ': 'pharyngeal_fric_vd',
            'h': 'h', 'ɦ': 'glottal_fric_vd',
            // Approximants
            'ɹ': 'turned_r', 'j': 'j', 'w': 'w',
            // Lateral approximants
            'l': 'l',
            // Vowels
            'i': 'i', 'ɪ': 'ih', 'e': 'e', 'ɛ': 'eps', 'æ': 'ae',
            'a': 'a', 'ɑ': 'alpha', 'ɒ': 'turned_script_a',
            'ɔ': 'open_o', 'o': 'o', 'ʊ': 'upsilon', 'u': 'u',
            'ʌ': 'turned_v', 'ɜ': 'rev_eps', 'ə': 'schwa',
            'ɐ': 'turned_a', 'ø': 'oslash', 'y': 'y',
            'ɵ': 'closemid_central_rounded', 'ɤ': 'closemid_back_unrounded',
            'œ': 'openmid_front_rounded', 'ɞ': 'openmid_central_rounded',
            'ɶ': 'open_front_rounded',
        };

        // English phoneme set used by the Practice feature
        const ENGLISH_SOUNDS = [
            { sym: 'p',  label: 'Voiceless bilabial plosive' },
            { sym: 'b',  label: 'Voiced bilabial plosive' },
            { sym: 't',  label: 'Voiceless alveolar plosive' },
            { sym: 'd',  label: 'Voiced alveolar plosive' },
            { sym: 'k',  label: 'Voiceless velar plosive' },
            { sym: 'ɡ',  label: 'Voiced velar plosive' },
            { sym: 'm',  label: 'Bilabial nasal' },
            { sym: 'n',  label: 'Alveolar nasal' },
            { sym: 'ŋ',  label: 'Velar nasal' },
            { sym: 'f',  label: 'Voiceless labiodental fricative' },
            { sym: 'v',  label: 'Voiced labiodental fricative' },
            { sym: 'θ',  label: 'Voiceless dental fricative' },
            { sym: 'ð',  label: 'Voiced dental fricative' },
            { sym: 's',  label: 'Voiceless alveolar sibilant' },
            { sym: 'z',  label: 'Voiced alveolar sibilant' },
            { sym: 'ʃ',  label: 'Voiceless palato-alveolar fricative' },
            { sym: 'ʒ',  label: 'Voiced palato-alveolar fricative' },
            { sym: 'h',  label: 'Voiceless glottal fricative' },
            { sym: 'ɹ',  label: 'Alveolar approximant' },
            { sym: 'j',  label: 'Palatal approximant' },
            { sym: 'w',  label: 'Labial-velar approximant' },
            { sym: 'l',  label: 'Alveolar lateral approximant' },
            { sym: 'i',  label: 'Close front unrounded vowel' },
            { sym: 'ɪ',  label: 'Near-close near-front unrounded vowel' },
            { sym: 'e',  label: 'Close-mid front unrounded vowel' },
            { sym: 'ɛ',  label: 'Open-mid front unrounded vowel' },
            { sym: 'æ',  label: 'Near-open front unrounded vowel' },
            { sym: 'ɑ',  label: 'Open back unrounded vowel' },
            { sym: 'ɒ',  label: 'Open back rounded vowel' },
            { sym: 'ɔ',  label: 'Open-mid back rounded vowel' },
            { sym: 'ʊ',  label: 'Near-close near-back rounded vowel' },
            { sym: 'u',  label: 'Close back rounded vowel' },
            { sym: 'ʌ',  label: 'Open-mid back unrounded vowel' },
            { sym: 'ɜ',  label: 'Open-mid central unrounded vowel' },
            { sym: 'ə',  label: 'Mid central vowel' },
        ];

        // ---- Render ----------------------------------------------------------
        function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
        function attr(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

        function chip(copyChar, display, title) {
            const d = display !== undefined ? display : copyChar;
            const cls = 'ipa-chip' + (AUDIO[copyChar] ? ' has-audio' : '');
            return `<button type="button" class="${cls}" data-char="${attr(copyChar)}"${title ? ` title="${attr(title)}"` : ''}>${esc(d)}</button>`;
        }

        function consonantTable() {
            const head = '<th class="rowhead"></th>' + PLACES.map(p => `<th>${esc(p)}</th>`).join('');
            const rows = MANNERS.map(([manner, cells]) => {
                const tds = cells.map(cell => {
                    if (cell === N) return '<td class="shaded"></td>';
                    if (cell.length === 0) return '<td></td>';
                    return '<td>' + cell.map(s => chip(s)).join('') + '</td>';
                }).join('');
                return `<tr><th class="rowhead">${esc(manner)}</th>${tds}</tr>`;
            }).join('');
            return `<div class="table-scroll"><table class="ipa-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
        }

        // items: [char, desc]
        function chipGrid(items) {
            return '<div class="chip-grid">' + items.map(([ch, desc]) =>
                `<div class="chip-item">${chip(ch, undefined, desc)}<span class="chip-desc">${esc(desc)}</span></div>`).join('') + '</div>';
        }

        function vowelChart() {
            const VB_W = 980, VB_H = 590;
            const CT = 150, CB = 520;   // more top padding so column labels clear the chip boxes
            const FT = 230, FB = 550, BK = 870;

            const rowY  = r => CT + (CB - CT) * r / 6;
            const frntX = r => FT + (FB - FT) * r / 6;
            const centX = r => (frntX(r) + BK) / 2;
            const nfX   = r => (frntX(r) + centX(r)) / 2;
            const nbX   = r => (centX(r) + BK) / 2;
            const colX  = (pos, r) => ({
                front: frntX(r), nearfront: nfX(r), central: centX(r), nearback: nbX(r), back: BK
            }[pos]);
            const f = n => Number(n).toFixed(1);

            // Chip geometry
            const CW = 32, CH = 36, CR = 7, OFF = 32;

            let s = '';

            s += `<polygon class="v-outline" points="${f(frntX(0))},${CT} ${BK},${CT} ${BK},${CB} ${f(frntX(6))},${CB}"/>`;

            [2, 4].forEach(r => {
                s += `<line class="v-line" x1="${f(frntX(r))}" y1="${f(rowY(r))}" x2="${BK}" y2="${f(rowY(r))}"/>`;
            });
            { const r = 1, y = rowY(r);
              s += `<line class="v-line" x1="${f(nfX(r))}" y1="${f(y)}" x2="${f(nbX(r))}" y2="${f(y)}"/>`; }

            s += `<line class="v-guide" x1="${f(centX(0))}" y1="${CT}" x2="${f(centX(6))}" y2="${CB}"/>`;

            [
                ['Front',           frntX(0)],
                [['Near', 'front'], nfX(0)],
                ['Central',         centX(0)],
                [['Near', 'back'],  nbX(0)],
                ['Back',            BK]
            ].forEach(([lbl, x]) => {
                if (Array.isArray(lbl)) {
                    s += `<text class="v-label" text-anchor="middle">` +
                         `<tspan x="${f(x)}" y="${CT - 46}">${lbl[0]}-</tspan>` +
                         `<tspan x="${f(x)}" dy="18">${lbl[1]}</tspan></text>`;
                } else {
                    s += `<text class="v-label" x="${f(x)}" y="${CT - 28}" text-anchor="middle">${lbl}</text>`;
                }
            });

            ['Close','Near-close','Close-mid','Mid','Open-mid','Near-open','Open']
                .forEach((lbl, r) => {
                    s += `<text class="v-label" x="5" y="${f(rowY(r))}" dominant-baseline="central">${lbl}</text>`;
                });

            // Render chips behind bullets so lines stay visible
            const chips = [];
            VOWELS.forEach(v => {
                const y = rowY(v.row), x = colX(v.pos, v.row);
                if (x === undefined) return;
                [[v.un, x - OFF], [v.ro, x + OFF]].forEach(([sym, cx]) => {
                    if (!sym) return;
                    const hasAudio = !!AUDIO[sym];
                    chips.push(
                        `<g class="vowel-chip${hasAudio ? ' has-audio' : ''}" data-char="${attr(sym)}">` +
                        `<rect class="v-chip-bg" x="${f(cx - CW/2)}" y="${f(y - CH/2)}" width="${CW}" height="${CH}" rx="${CR}"/>` +
                        `<text class="vowel-sym" x="${f(cx)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central">${esc(sym)}</text>` +
                        `</g>`
                    );
                });
            });

            // Draw bullets on top of chips
            VOWELS.forEach(v => {
                const y = rowY(v.row), x = colX(v.pos, v.row);
                if (x === undefined) return;
                s += `<circle class="v-bullet" cx="${f(x)}" cy="${f(y)}" r="3.5"/>`;
            });

            // Chips rendered last so hover outline is never clipped
            s += chips.join('');

            return `<div class="vowel-scroll"><div class="vowel-wrap"><svg class="vowel-svg" viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="IPA vowel chart">${s}</svg></div></div>`;
        }

        function section(title, inner, subtitle) {
            return `<section class="glass-panel chart-section">
                <h2>${esc(title)}</h2>
                ${subtitle ? `<p class="chart-sub">${esc(subtitle)}</p>` : ''}
                ${inner}
            </section>`;
        }

        // ---- Practice feature -----------------------------------------------
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        let testMode = 'visual';

        function pickItems() {
            const pool = testMode === 'aural'
                ? ENGLISH_SOUNDS.filter(s => AUDIO[s.sym])
                : ENGLISH_SOUNDS;
            return shuffle(pool).slice(0, 10);
        }

        const SVG_PLAY = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd"/></svg>`;
        const SVG_REPLAY = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="12" height="12" aria-hidden="true"><path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 0 1-9.201 2.466l-.312-.311h2.433a.75.75 0 0 0 0-1.5H3.989a.75.75 0 0 0-.75.75v4.242a.75.75 0 0 0 1.5 0v-2.43l.31.31a7 7 0 0 0 11.712-3.138.75.75 0 0 0-1.449-.39Zm1.23-3.723a.75.75 0 0 0 .219-.53V3.93a.75.75 0 0 0-1.5 0V6.36l-.31-.31A7 7 0 0 0 3.239 9.187a.75.75 0 1 0 1.448.389A5.5 5.5 0 0 1 13.89 6.11l.311.31h-2.432a.75.75 0 0 0 0 1.5h4.243a.75.75 0 0 0 .53-.219Z" clip-rule="evenodd"/></svg>`;
        const SVG_SPEAKER_ON  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/></svg>`;
        const SVG_SPEAKER_OFF = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 0 0-1.06-1.06l-1.72 1.72-1.72-1.72Z"/></svg>`;

        function renderTestCard(item) {
            if (testMode === 'visual') {
                return `<div class="test-card" data-sym="${attr(item.sym)}">
                    <div class="test-card-inner">
                        <div class="test-card-front">
                            <span class="card-sym-lg">${esc(item.sym)}</span>
                            <button class="card-reveal-btn">Reveal</button>
                        </div>
                        <div class="test-card-back">
                            <span class="card-sym-sm">${esc(item.sym)}</span>
                            <span class="card-label">${esc(item.label)}</span>
                        </div>
                    </div>
                </div>`;
            } else {
                return `<div class="test-card">
                    <div class="test-card-inner">
                        <div class="test-card-front">
                            <button class="card-play-btn" data-sym="${attr(item.sym)}" aria-label="Play sound">${SVG_PLAY}</button>
                            <button class="card-reveal-btn">Reveal</button>
                        </div>
                        <div class="test-card-back">
                            <span class="card-sym-sm">${esc(item.sym)}</span>
                            <span class="card-label">${esc(item.label)}</span>
                            <button class="card-replay-btn" data-sym="${attr(item.sym)}" aria-label="Replay">${SVG_REPLAY} replay</button>
                        </div>
                    </div>
                </div>`;
            }
        }

        function updateProgress() {
            const revealed = document.querySelectorAll('#testGrid .test-card.flipped').length;
            const el = document.getElementById('testProgress');
            if (el) el.textContent = `${revealed} / 10 revealed`;
        }

        function renderTest() {
            const items = pickItems();
            const grid = document.getElementById('testGrid');
            if (!grid) return;
            grid.innerHTML = items.map(renderTestCard).join('');
            const el = document.getElementById('testProgress');
            if (el) el.textContent = '0 / 10 revealed';
        }

        function practiceSection() {
            return `<div class="practice-controls">
                <div class="mode-tabs">
                    <button type="button" class="mode-tab active" id="testVisualBtn">Visual</button>
                    <button type="button" class="mode-tab" id="testAuralBtn">Aural</button>
                </div>
                <button type="button" class="new-set-btn" id="testNewBtn">↻ New set</button>
                <span class="practice-progress" id="testProgress">0 / 10 revealed</span>
            </div>
            <div class="test-grid" id="testGrid"></div>`;
        }

        document.getElementById('chart').innerHTML = [
            section('Consonants (Pulmonic)', consonantTable(), 'Where symbols appear in pairs, the one to the left is voiceless and the one to the right is voiced. Shaded areas are judged impossible.'),
            section('Vowels', vowelChart(), 'Where symbols appear in pairs, the one to the left is unrounded and the one to the right is rounded.'),
            section('Consonants (Non-Pulmonic)',
                '<h3 class="chart-sub" style="font-weight:600;">Clicks</h3>' + chipGrid(CLICKS) +
                '<h3 class="chart-sub" style="font-weight:600;">Voiced implosives</h3>' + chipGrid(IMPLOSIVES) +
                '<h3 class="chart-sub" style="font-weight:600;">Ejectives</h3>' + chipGrid(EJECTIVES)),
            section('Other Symbols', chipGrid(OTHER)),
            section('Practice', practiceSection(), 'English phonemes — click each card to reveal the name and classification. Switch to Aural to practise by ear.')
        ].join('');

        // ---- Practice events -------------------------------------------------
        renderTest();

        document.getElementById('testVisualBtn').addEventListener('click', () => {
            testMode = 'visual';
            document.getElementById('testVisualBtn').classList.add('active');
            document.getElementById('testAuralBtn').classList.remove('active');
            renderTest();
        });
        document.getElementById('testAuralBtn').addEventListener('click', () => {
            testMode = 'aural';
            document.getElementById('testAuralBtn').classList.add('active');
            document.getElementById('testVisualBtn').classList.remove('active');
            renderTest();
        });
        document.getElementById('testNewBtn').addEventListener('click', renderTest);

        document.getElementById('testGrid').addEventListener('click', e => {
            // Replay button (back face)
            const replayBtn = e.target.closest('.card-replay-btn');
            if (replayBtn) {
                const slug = AUDIO[replayBtn.dataset.sym];
                if (slug) playSound(slug);
                return;
            }
            // Play button (front face) — sound only, no flip
            const playBtn = e.target.closest('.card-play-btn');
            if (playBtn) {
                const slug = AUDIO[playBtn.dataset.sym];
                if (slug) playSound(slug);
                return;
            }
            // Reveal button — flip and play sound if available
            const revealBtn = e.target.closest('.card-reveal-btn');
            if (revealBtn) {
                const card = revealBtn.closest('.test-card');
                if (card && !card.classList.contains('flipped')) {
                    card.classList.add('flipped');
                    updateProgress();
                    const slug = AUDIO[card.dataset.sym];
                    if (slug && soundOn) playSound(slug);
                }
            }
        });

        // ---- Copy ------------------------------------------------------------
        function legacyCopy(text) {
            const t = document.createElement('textarea');
            t.value = text;
            t.style.position = 'fixed';
            t.style.opacity = '0';
            document.body.appendChild(t);
            t.focus();
            t.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
            document.body.removeChild(t);
            return ok;
        }

        // Always resolves (never rejects) so UI feedback fires even if the
        // async Clipboard API is unavailable or blocked.
        function copy(text) {
            return new Promise(resolve => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(
                        () => resolve(true),
                        () => resolve(legacyCopy(text))
                    );
                } else {
                    resolve(legacyCopy(text));
                }
            });
        }

        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.hidden = false;
            void el.offsetWidth; // force reflow so the transition runs
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => { el.hidden = true; }, 200);
            }, 1300);
        }

        // ---- Audio -----------------------------------------------------------
        let soundOn = true;
        const audioEl = new Audio();
        audioEl.preload = 'none';
        function playSound(slug) {
            try {
                audioEl.pause();
                audioEl.src = 'audio/' + slug + '.mp3';
                audioEl.currentTime = 0;
                audioEl.play().catch(() => { /* autoplay/gesture issues ignored */ });
            } catch (e) { /* ignore */ }
        }

        const soundToggle = document.getElementById('soundToggle');
        function updateSoundToggle() {
            soundToggle.innerHTML = soundOn
                ? `${SVG_SPEAKER_ON}<span>Sound on</span>`
                : `${SVG_SPEAKER_OFF}<span>Sound off</span>`;
            soundToggle.setAttribute('aria-pressed', String(soundOn));
            soundToggle.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
            soundToggle.classList.toggle('off', !soundOn);
        }
        updateSoundToggle();
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            updateSoundToggle();
        });

        document.getElementById('chart').addEventListener('click', (e) => {
            const el = e.target.closest('[data-char]');
            if (!el) return;
            const ch = el.dataset.char;
            const slug = AUDIO[ch];
            const played = soundOn && slug;
            if (played) playSound(slug);
            copy(ch).then(() => {
                const display = el.dataset.char || el.textContent;
                showToast((played ? '🔊 ' : '') + 'Copied  ' + display);
                el.classList.add('copied');
                setTimeout(() => el.classList.remove('copied'), 450);
            });
        });
    </script>
</body>

</html>
