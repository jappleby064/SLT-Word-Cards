<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA Chart | SLT Word Cards</title>
    <meta name="description" content="International Phonetic Alphabet (IPA) chart of consonants and vowels laid out in the standard arrangement. Click any symbol to copy it to your clipboard.">
    <link rel="canonical" href="https://speakeasy-slt.uk/ipa-chart.html">

    <!-- Favicon -->
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Widen the container for the wide consonant table */
        .app-container { max-width: 1140px; }

        .chart { display: flex; flex-direction: column; gap: 1.5rem; }
        .chart-section { gap: 1rem; }
        .chart-sub { color: var(--text-secondary); font-size: 0.9rem; margin-top: -0.5rem; }

        .table-scroll { overflow-x: auto; }
        .ipa-table { border-collapse: collapse; width: 100%; }
        .ipa-table th,
        .ipa-table td { border: 1px solid rgba(203, 213, 225, 0.7); text-align: center; padding: 2px; }
        .ipa-table thead th {
            font-size: 0.68rem; font-weight: 600; color: var(--text-secondary);
            padding: 5px 3px; background: rgba(99, 102, 241, 0.06); line-height: 1.15;
        }
        .ipa-table .rowhead {
            font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
            text-align: left; white-space: nowrap; padding: 0 8px; background: rgba(99, 102, 241, 0.06);
        }
        .ipa-table td.shaded {
            background: repeating-linear-gradient(45deg,
                rgba(148, 163, 184, 0.28), rgba(148, 163, 184, 0.28) 4px,
                rgba(148, 163, 184, 0.12) 4px, rgba(148, 163, 184, 0.12) 8px);
        }

        .ipa-chip {
            min-width: 2rem; height: 2rem; padding: 0 0.35rem; margin: 1px;
            border: 1px solid rgba(203, 213, 225, 0.8); border-radius: 6px;
            background: rgba(255, 255, 255, 0.9); font-family: 'Inter', sans-serif;
            font-size: 1.15rem; line-height: 1; color: var(--text-primary);
            cursor: pointer; transition: all 0.12s ease;
        }
        .ipa-chip:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); transform: translateY(-1px); }
        .ipa-chip.copied { background: #22c55e; color: #fff; border-color: #22c55e; }

        .chip-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .chip-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; width: 6rem; text-align: center; }
        .chip-desc { font-size: 0.68rem; color: var(--text-secondary); line-height: 1.2; }

        /* Vowel trapezium */
        .vowel-wrap { max-width: 640px; margin: 0 auto; }
        .vowel-svg { width: 100%; height: auto; font-family: 'Inter', sans-serif; }
        .vowel-svg .v-outline { fill: none; stroke: #475569; stroke-width: 1.5; }
        .vowel-svg .v-line { stroke: #475569; stroke-width: 1; }
        .vowel-svg .v-bullet { fill: #1e293b; }
        .vowel-svg .v-label { fill: var(--text-secondary); font-size: 14px; font-weight: 600; }
        .vowel-svg .vowel-sym { fill: var(--text-primary); font-size: 30px; cursor: pointer; transition: fill 0.12s ease; }
        .vowel-svg .vowel-sym:hover { fill: var(--primary-color); }
        .vowel-svg .vowel-sym.copied { fill: #22c55e; }

        .ipa-toast {
            position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(1rem);
            background: rgba(30, 41, 59, 0.95); color: #fff; padding: 0.6rem 1.1rem;
            border-radius: 9999px; font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-md); opacity: 0; transition: all 0.2s ease;
            pointer-events: none; z-index: 100;
        }
        .ipa-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="top-nav">
            <a href="index.html" class="nav-link">Word Cards</a>
            <a href="ipa-chart.html" class="nav-link active">IPA Chart</a>
        </nav>
        <header class="app-header">
            <h1>IPA Chart</h1>
            <p>Consonants and vowels in the standard arrangement. Click any symbol to copy it.</p>
        </header>

        <main id="chart" class="chart"></main>

        <footer style="text-align: center; color: var(--text-secondary); font-size: 0.9rem; padding-top: 1rem;">
            made with love · <a href="index.html" style="color: var(--primary-hover);">Word Cards</a>
        </footer>
    </div>

    <div id="toast" class="ipa-toast" hidden></div>

    <script>
        // ---- Data ------------------------------------------------------------
        const N = null; // shaded (articulation judged impossible)

        const PLACES = ['Bilabial', 'Labiodental', 'Dental', 'Alveolar', 'Postalveolar', 'Retroflex', 'Palatal', 'Velar', 'Uvular', 'Pharyngeal', 'Glottal'];

        // Each manner row: 11 cells. Cell = array of symbols (voiceless, voiced),
        // [] = possible but unattested (blank), N = shaded (impossible).
        const MANNERS = [
            ['Plosive',             [['p', 'b'], [], [], ['t', 'd'], [], ['ʈ', 'ɖ'], ['c', 'ɟ'], ['k', 'ɡ'], ['q', 'ɢ'], N, ['ʔ']]],
            ['Nasal',               [['m'], ['ɱ'], [], ['n'], [], ['ɳ'], ['ɲ'], ['ŋ'], ['ɴ'], N, N]],
            ['Trill',               [['ʙ'], [], [], ['r'], [], N, N, N, ['ʀ'], N, N]],
            ['Tap or Flap',         [N, ['ⱱ'], [], ['ɾ'], [], ['ɽ'], N, N, N, N, N]],
            ['Fricative',           [['ɸ', 'β'], ['f', 'v'], ['θ', 'ð'], ['s', 'z'], ['ʃ', 'ʒ'], ['ʂ', 'ʐ'], ['ç', 'ʝ'], ['x', 'ɣ'], ['χ', 'ʁ'], ['ħ', 'ʕ'], ['h', 'ɦ']]],
            ['Lateral fricative',   [N, N, [], ['ɬ', 'ɮ'], [], [], [], [], N, N, N]],
            ['Approximant',         [[], ['ʋ'], [], ['ɹ'], [], ['ɻ'], ['j'], ['ɰ'], [], [], []]],
            ['Lateral approximant', [N, N, [], ['l'], [], ['ɭ'], ['ʎ'], ['ʟ'], [], N, N]]
        ];

        const CLICKS = [['ʘ', 'Bilabial'], ['ǀ', 'Dental'], ['ǃ', '(Post)alveolar'], ['ǂ', 'Palatoalveolar'], ['ǁ', 'Alveolar lateral']];
        const IMPLOSIVES = [['ɓ', 'Bilabial'], ['ɗ', 'Dental/alveolar'], ['ʄ', 'Palatal'], ['ɠ', 'Velar'], ['ʛ', 'Uvular']];
        const EJECTIVES = [['ʼ', 'Ejective mark'], ['pʼ', 'Bilabial'], ['tʼ', 'Alveolar'], ['kʼ', 'Velar'], ['sʼ', 'Alveolar fricative']];

        // Vowels positioned on the trapezium. row 0..6 (Close..Open),
        // pos = front | nearfront | central | nearback | back.
        // un = unrounded (left of bullet), ro = rounded (right of bullet).
        const VOWELS = [
            { row: 0, pos: 'front',     un: 'i', ro: 'y' },
            { row: 0, pos: 'central',   un: 'ɨ', ro: 'ʉ' },
            { row: 0, pos: 'back',      un: 'ɯ', ro: 'u' },
            { row: 1, pos: 'nearfront', un: 'ɪ', ro: 'ʏ' },
            { row: 1, pos: 'nearback',  un: '',  ro: 'ʊ' },
            { row: 2, pos: 'front',     un: 'e', ro: 'ø' },
            { row: 2, pos: 'central',   un: 'ɘ', ro: 'ɵ' },
            { row: 2, pos: 'back',      un: 'ɤ', ro: 'o' },
            { row: 3, pos: 'central',   un: 'ə', ro: '' },
            { row: 4, pos: 'front',     un: 'ɛ', ro: 'œ' },
            { row: 4, pos: 'central',   un: 'ɜ', ro: 'ɞ' },
            { row: 4, pos: 'back',      un: 'ʌ', ro: 'ɔ' },
            { row: 5, pos: 'front',     un: 'æ', ro: '' },
            { row: 5, pos: 'central',   un: 'ɐ', ro: '' },
            { row: 6, pos: 'front',     un: 'a', ro: 'ɶ' },
            { row: 6, pos: 'back',      un: 'ɑ', ro: 'ɒ' }
        ];

        // ---- Render ----------------------------------------------------------
        function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
        function attr(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

        function chip(copyChar, display, title) {
            const d = display !== undefined ? display : copyChar;
            return `<button type="button" class="ipa-chip" data-char="${attr(copyChar)}"${title ? ` title="${attr(title)}"` : ''}>${esc(d)}</button>`;
        }

        function consonantTable() {
            const head = '<th class="rowhead"></th>' + PLACES.map(p => `<th>${esc(p)}</th>`).join('');
            const rows = MANNERS.map(([manner, cells]) => {
                const tds = cells.map(cell => {
                    if (cell === N) return '<td class="shaded"></td>';
                    if (cell.length === 0) return '<td></td>';
                    return '<td>' + cell.map(s => chip(s)).join('') + '</td>';
                }).join('');
                return `<tr><th class="rowhead">${esc(manner)}</th>${tds}</tr>`;
            }).join('');
            return `<div class="table-scroll"><table class="ipa-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
        }

        // items: [char, desc]
        function chipGrid(items) {
            return '<div class="chip-grid">' + items.map(([ch, desc]) =>
                `<div class="chip-item">${chip(ch, undefined, desc)}<span class="chip-desc">${esc(desc)}</span></div>`).join('') + '</div>';
        }

        function vowelChart() {
            const TOP = 110, BOT = 470, FRONT_TOP = 120, FRONT_BOT = 400, BACK = 700, CENT_TOP = 410, CENT_BOT = 550;
            const vy = row => TOP + (BOT - TOP) * row / 6;
            const frontX = y => FRONT_TOP + (FRONT_BOT - FRONT_TOP) * (y - TOP) / (BOT - TOP);
            const centX = y => CENT_TOP + (CENT_BOT - CENT_TOP) * (y - TOP) / (BOT - TOP);
            const nearFrontX = y => (frontX(y) + centX(y)) / 2;
            const nearBackX = y => (centX(y) + BACK) / 2;
            const posX = (pos, y) => pos === 'front' ? frontX(y) : pos === 'central' ? centX(y)
                : pos === 'back' ? BACK : pos === 'nearfront' ? nearFrontX(y) : nearBackX(y);
            const f = n => Number(n).toFixed(1);

            let s = '';
            // Outline trapezium
            s += `<polygon class="v-outline" points="${FRONT_TOP},${TOP} ${BACK},${TOP} ${BACK},${BOT} ${FRONT_BOT},${BOT}"/>`;
            // Horizontal lines at close-mid (row 2) and open-mid (row 4)
            [2, 4].forEach(r => { const y = vy(r); s += `<line class="v-line" x1="${f(frontX(y))}" y1="${y}" x2="${BACK}" y2="${y}"/>`; });
            // Central guide line
            s += `<line class="v-line" x1="${f(centX(TOP))}" y1="${TOP}" x2="${f(centX(BOT))}" y2="${BOT}"/>`;

            // Column labels
            [['Front', FRONT_TOP], ['Near front', (FRONT_TOP + CENT_TOP) / 2], ['Central', CENT_TOP], ['Near back', (CENT_TOP + BACK) / 2], ['Back', BACK]]
                .forEach(([t, x]) => { s += `<text class="v-label" x="${f(x)}" y="92" text-anchor="middle">${t}</text>`; });
            // Row labels
            ['Close', 'Near close', 'Close mid', 'Mid', 'Open mid', 'Near open', 'Open']
                .forEach((t, i) => { s += `<text class="v-label" x="2" y="${vy(i)}" dominant-baseline="central">${t}</text>`; });

            // Bullets + clickable symbols
            VOWELS.forEach(v => {
                const y = vy(v.row), x = posX(v.pos, y);
                s += `<circle class="v-bullet" cx="${f(x)}" cy="${y}" r="3"/>`;
                if (v.un) s += `<text class="vowel-sym" data-char="${attr(v.un)}" x="${f(x - 13)}" y="${y}" text-anchor="end" dominant-baseline="central">${esc(v.un)}</text>`;
                if (v.ro) s += `<text class="vowel-sym" data-char="${attr(v.ro)}" x="${f(x + 13)}" y="${y}" text-anchor="start" dominant-baseline="central">${esc(v.ro)}</text>`;
            });

            return `<div class="vowel-wrap"><svg class="vowel-svg" viewBox="0 0 770 505" role="img" aria-label="IPA vowel chart">${s}</svg></div>`;
        }

        function section(title, inner, subtitle) {
            return `<section class="glass-panel chart-section">
                <h2>${esc(title)}</h2>
                ${subtitle ? `<p class="chart-sub">${esc(subtitle)}</p>` : ''}
                ${inner}
            </section>`;
        }

        document.getElementById('chart').innerHTML = [
            section('Consonants (Pulmonic)', consonantTable(), 'Where symbols appear in pairs, the one to the left is voiceless and the one to the right is voiced. Shaded areas are judged impossible.'),
            section('Consonants (Non-Pulmonic)',
                '<h3 class="chart-sub" style="font-weight:600;">Clicks</h3>' + chipGrid(CLICKS) +
                '<h3 class="chart-sub" style="font-weight:600;">Voiced implosives</h3>' + chipGrid(IMPLOSIVES) +
                '<h3 class="chart-sub" style="font-weight:600;">Ejectives</h3>' + chipGrid(EJECTIVES)),
            section('Vowels', vowelChart(), 'Where symbols appear in pairs, the one to the left is unrounded and the one to the right is rounded.')
        ].join('');

        // ---- Copy ------------------------------------------------------------
        function legacyCopy(text) {
            const t = document.createElement('textarea');
            t.value = text;
            t.style.position = 'fixed';
            t.style.opacity = '0';
            document.body.appendChild(t);
            t.focus();
            t.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
            document.body.removeChild(t);
            return ok;
        }

        // Always resolves (never rejects) so UI feedback fires even if the
        // async Clipboard API is unavailable or blocked.
        function copy(text) {
            return new Promise(resolve => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(
                        () => resolve(true),
                        () => resolve(legacyCopy(text))
                    );
                } else {
                    resolve(legacyCopy(text));
                }
            });
        }

        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.hidden = false;
            void el.offsetWidth; // force reflow so the transition runs
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => { el.hidden = true; }, 200);
            }, 1300);
        }

        document.getElementById('chart').addEventListener('click', (e) => {
            const el = e.target.closest('[data-char]');
            if (!el) return;
            const ch = el.dataset.char;
            copy(ch).then(() => {
                showToast('Copied  ' + el.textContent);
                el.classList.add('copied');
                setTimeout(() => el.classList.remove('copied'), 450);
            });
        });
    </script>
</body>

</html>
