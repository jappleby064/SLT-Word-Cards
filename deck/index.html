<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A practice deck | SLT Word Cards</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://speakeasy-slt.uk/">
    <link rel="icon" href="../logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">

    <!--
        Its own preview, so a deck sent by message doesn't come up looking like
        the site's front page. It can't name the deck or count the cards: those
        live in the fragment, which no crawler ever sees — which is the same
        reason the deck itself stays private.
    -->
    <meta name="description" content="A set of speech and language therapy word cards, shared to practise with.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SLT Word Cards">
    <meta property="og:title" content="A practice deck of word cards">
    <meta property="og:description" content="Open to work through the cards one at a time, or print them.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="A practice deck of word cards">
    <meta name="twitter:description" content="Open to work through the cards one at a time, or print them.">
</head>

<body>
    <!--
        Shared decks are addressed as /deck/#deck=<payload> for one reason: it
        gives Apple's universal links a single path to claim, so tapping a
        shared deck opens the app while every other link to the site still
        opens the website.

        On a device without the app the browser lands here instead, and this
        page hands the deck to the main app. The payload is in the fragment, so
        it never left the device to begin with — including on this hop.
    -->
    <div class="app-container">
        <header class="app-header">
            <h1>Opening your deck…</h1>
            <p id="deckFallbackMessage">One moment.</p>
        </header>
        <p style="text-align:center;">
            <a id="deckFallbackLink" class="nav-link" href="../">Open SLT Word Cards</a>
        </p>
    </div>

    <script>
        (function () {
            var fragment = location.hash || '';
            var target = '../' + fragment;

            document.getElementById('deckFallbackLink').setAttribute('href', target);

            if (fragment.indexOf('deck=') !== -1) {
                location.replace(target);
            } else {
                document.getElementById('deckFallbackMessage').textContent =
                    'This link had no deck attached. Open the card tool to build one.';
            }
        })();
    </script>
</body>

</html>
