<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Speakeasy SLT">
  <!--
    Flat, one colour, no gradient and no gloss: the same teal the site is built
    from (#135e5c). The previous mark was an indigo to violet gradient with a
    drop shadow, which is the look the rest of the redesign moved away from.
  -->
  <path d="M6,15 Q6,6 15,6 L85,6 Q94,6 94,15 L94,66 Q94,75 85,75 L44,75 L27,93 L27,75 L15,75 Q6,75 6,66 Z"
        fill="#135e5c"/>
  <text x="50" y="42.5"
        font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif"
        font-size="30" font-weight="600"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle"
        letter-spacing="0.5">SLT</text>
</svg>
